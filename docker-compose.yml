services:
  postgres:
    image: postgres:16-alpine
    container_name: mpf-postgres
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: mpf
      POSTGRES_PASSWORD: mpf
      POSTGRES_DB: mpf
    volumes:
      - mpf_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mpf -d mpf']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mpf_pg_data:
